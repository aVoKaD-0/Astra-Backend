[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astra"
version = "0.1.0"
description = "Building materials data pipeline and PostgreSQL API"
readme = "README.MD"
requires-python = ">=3.9"
dependencies = [
    "SQLAlchemy>=2.0.10,<2.1",
    "psycopg[binary]>=3.2,<3.3",
    "python-dotenv>=1.0,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["core*"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
